<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>数字合わせゲーム</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* タッチデバイスでの不要なスクロールや選択を防止 */
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    
    /* タップ時の視覚効果（要素の位置移動 transform は一切使用しない） */
    .tap-target {
      transition: background-color 0.1s ease, border-color 0.1s ease, opacity 0.1s ease;
      cursor: pointer;
    }
    .tap-target:active {
      opacity: 0.7;
      background-color: #e0f2fe !important;
      border-color: #3b82f6 !important;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

  <div class="bg-white rounded-3xl shadow-xl p-6 sm:p-8 w-full max-w-md text-center relative overflow-hidden min-h-[560px] flex flex-col justify-between">
    
    <!-- ヘッダー -->
    <div>
      <h1 class="text-2xl font-bold text-slate-700 tracking-wide">数字合わせゲーム</h1>
      <p class="text-xs text-slate-400 mt-1">合わせて目標の数になる数字をタップしよう！</p>
    </div>

    <!-- スタート画面 -->
    <div id="start-screen" class="my-auto space-y-5 py-2">
      
      <!-- モード選択 -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">目指す数字を選択</label>
        <div class="grid grid-cols-2 gap-2.5 max-w-xs mx-auto" id="target-selector">
          <button onclick="selectTarget(10)" id="btn-10" class="target-btn py-2.5 border-2 border-blue-500 bg-blue-50 text-blue-600 font-black text-lg rounded-xl transition duration-150">10</button>
          <button onclick="selectTarget(60)" id="btn-60" class="target-btn py-2.5 border-2 border-slate-200 text-slate-600 font-bold text-lg rounded-xl transition duration-150">60 <span class="text-xs font-normal text-slate-400">(分)</span></button>
          <button onclick="selectTarget(90)" id="btn-90" class="target-btn py-2.5 border-2 border-slate-200 text-slate-600 font-bold text-lg rounded-xl transition duration-150">90 <span class="text-xs font-normal text-slate-400">(角)</span></button>
          <button onclick="selectTarget(100)" id="btn-100" class="target-btn py-2.5 border-2 border-slate-200 text-slate-600 font-bold text-lg rounded-xl transition duration-150">100</button>
        </div>
      </div>

      <!-- ランキング表示エリア -->
      <div class="bg-slate-50 rounded-2xl p-3 border border-slate-100 max-w-xs mx-auto">
        <div class="flex justify-between items-center mb-1 px-1">
          <span class="text-xs font-bold text-slate-500">🏆 「<span id="ranking-mode-title">10</span>」 ベストタイム</span>
          <button onclick="resetCurrentRanking()" class="text-[10px] text-slate-400 hover:text-rose-500 underline">リセット</button>
        </div>
        <ol id="start-ranking-list" class="text-xs space-y-1 font-semibold text-slate-600 text-left px-2">
          <!-- JSで動的に追加 -->
        </ol>
      </div>

      <button onclick="startGame()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg rounded-2xl shadow-lg hover:shadow-xl transition duration-200">
        スタート
      </button>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="hidden my-auto flex-1 flex flex-col justify-between py-2 relative">
      <!-- スコア＆進捗バー -->
      <div>
        <div class="w-full bg-slate-100 rounded-full h-3 mb-3 overflow-hidden">
          <div id="progress-bar" class="bg-blue-500 h-3 rounded-full transition-all duration-300" style="width: 10%"></div>
        </div>
        
        <div class="flex justify-between items-center text-sm font-semibold text-slate-500 px-2">
          <span>目標: <strong id="game-target-badge" class="text-blue-600 text-base">10</strong> | 問題: <strong id="question-num" class="text-blue-600 text-base">1</strong> / 10</span>
          <span id="timer">0.0 秒</span>
        </div>
      </div>

      <!-- フィールド（絶対座標で完全に位置固定） -->
      <div class="relative w-72 h-72 mx-auto my-auto flex-shrink-0">
        
        <!-- 上（TOP）ターゲット：left: 96px (288pxの1/2からボタン幅80pxの半分40pxを引いた絶対位置) -->
        <button onclick="handleTap('top')" data-position="top" class="tap-target absolute top-0 left-[96px] w-20 h-20 rounded-2xl border-4 border-blue-200 bg-slate-50 hover:bg-blue-50 flex items-center justify-center text-2xl font-extrabold text-slate-700 shadow-md">
          <span class="target-val">?</span>
        </button>

        <!-- 左下（BOTTOM LEFT）ターゲット -->
        <button onclick="handleTap('bottom-left')" data-position="bottom-left" class="tap-target absolute bottom-2 left-2 w-20 h-20 rounded-2xl border-4 border-blue-200 bg-slate-50 hover:bg-blue-50 flex items-center justify-center text-2xl font-extrabold text-slate-700 shadow-md">
          <span class="target-val">?</span>
        </button>

        <!-- 右下（BOTTOM RIGHT）ターゲット -->
        <button onclick="handleTap('bottom-right')" data-position="bottom-right" class="tap-target absolute bottom-2 right-2 w-20 h-20 rounded-2xl border-4 border-blue-200 bg-slate-50 hover:bg-blue-50 flex items-center justify-center text-2xl font-extrabold text-slate-700 shadow-md">
          <span class="target-val">?</span>
        </button>

        <!-- 中央の数字（表示のみ）：top: 96px, left: 96px -->
        <div id="center-node" class="absolute top-[96px] left-[96px] w-20 h-20 bg-blue-500 text-white rounded-2xl flex items-center justify-center text-3xl font-black shadow-xl z-20">
          <span id="center-val">?</span>
        </div>

      </div>

      <!-- 正誤フィードバック表示 -->
      <div class="h-8 relative w-full flex items-center justify-center">
        <div id="feedback" class="absolute inset-0 flex items-center justify-center text-base font-bold"></div>
      </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="hidden my-auto space-y-4 py-2">
      <div class="text-slate-500 text-sm font-semibold">クリア！</div>
      
      <div class="bg-blue-50 rounded-2xl p-5 border border-blue-100">
        <div id="new-record-badge" class="hidden text-xs font-black text-amber-500 tracking-wider uppercase bg-amber-100 px-3 py-1 rounded-full w-fit mx-auto mb-2">
          🎉 自己ベスト更新！
        </div>
        <div id="final-mode" class="text-xs font-bold text-blue-500 mb-1">目標：10</div>

        <div class="text-xs text-slate-400 font-bold uppercase mb-0.5">タイム</div>
        <div id="final-time" class="text-4xl font-black text-blue-600 mb-3">0.00 秒</div>
        
        <div class="text-xs text-slate-400 font-bold uppercase mb-0.5">正解率</div>
        <div id="final-score" class="text-xl font-extrabold text-slate-700">10 / 10 問</div>
      </div>

      <!-- 結果画面のランキング表示 -->
      <div class="bg-slate-50 rounded-2xl p-3 border border-slate-100 max-w-xs mx-auto">
        <div class="text-xs font-bold text-slate-500 mb-1.5">🏆 「<span id="result-ranking-title">10</span>」 ランキング</div>
        <ol id="result-ranking-list" class="text-xs space-y-1 font-semibold text-slate-600 text-left px-2">
          <!-- JSで動的に追加 -->
        </ol>
      </div>

      <button onclick="backToStart()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg rounded-2xl shadow-lg hover:shadow-xl transition duration-200">
        もう一度遊ぶ
      </button>
    </div>

  </div>

  <script>
    const TOTAL_QUESTIONS = 10;
    let targetGoal = 10;
    let currentQuestion = 1;
    let correctCount = 0;
    let centerNumber = 0;
    let targetValues = {};
    let correctAnswerPosition = '';
    let isAnswering = false;
    
    let startTime = 0;
    let timerInterval = null;

    // DOM要素
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const resultScreen = document.getElementById('result-screen');
    const centerVal = document.getElementById('center-val');
    const questionNum = document.getElementById('question-num');
    const progressBar = document.getElementById('progress-bar');
    const timerElem = document.getElementById('timer');
    const feedbackElem = document.getElementById('feedback');
    const gameTargetBadge = document.getElementById('game-target-badge');

    // 初期化ロード
    window.addEventListener('DOMContentLoaded', () => {
      updateRankingDisplay();
    });

    // 目標の数値を選択
    function selectTarget(num) {
      targetGoal = num;
      
      document.querySelectorAll('.target-btn').forEach(btn => {
        btn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-600', 'font-black');
        btn.classList.add('border-slate-200', 'text-slate-600', 'font-bold');
      });

      const selectedBtn = document.getElementById(`btn-${num}`);
      selectedBtn.classList.remove('border-slate-200', 'text-slate-600', 'font-bold');
      selectedBtn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-600', 'font-black');

      updateRankingDisplay();
    }

    // ゲーム開始
    function startGame() {
      currentQuestion = 1;
      correctCount = 0;
      isAnswering = false;
      gameTargetBadge.textContent = targetGoal;
      
      startScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');

      startTime = Date.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 100);

      nextQuestion();
    }

    // スタート画面に戻る
    function backToStart() {
      resultScreen.classList.add('hidden');
      startScreen.classList.remove('hidden');
      updateRankingDisplay();
    }

    // タイマー更新
    function updateTimer() {
      const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
      timerElem.textContent = `${elapsed} 秒`;
    }

    // 問題生成
    function nextQuestion() {
      if (currentQuestion > TOTAL_QUESTIONS) {
        endGame();
        return;
      }

      isAnswering = false;
      feedbackElem.textContent = '';
      feedbackElem.className = 'absolute inset-0 flex items-center justify-center text-base font-bold';
      questionNum.textContent = currentQuestion;
      progressBar.style.width = `${(currentQuestion / TOTAL_QUESTIONS) * 100}%`;

      generateNumbersForTarget(targetGoal);

      const correctVal = targetGoal - centerNumber;
      const positions = ['top', 'bottom-left', 'bottom-right'];
      correctAnswerPosition = positions[Math.floor(Math.random() * positions.length)];

      let dummyCandidates = [];
      if (targetGoal === 90) {
        for (let i = 5; i < 90; i += 5) {
          if (i !== correctVal) dummyCandidates.push(i);
        }
      } else {
        for (let i = 1; i < targetGoal; i++) {
          if (i !== correctVal) dummyCandidates.push(i);
        }
      }
      shuffleArray(dummyCandidates);

      targetValues = {};
      let dummyIdx = 0;

      positions.forEach(pos => {
        const targetElem = document.querySelector(`[data-position="${pos}"]`);
        const valSpan = targetElem.querySelector('.target-val');
        
        if (pos === correctAnswerPosition) {
          targetValues[pos] = correctVal;
          valSpan.textContent = correctVal;
        } else {
          const dummyVal = dummyCandidates[dummyIdx++];
          targetValues[pos] = dummyVal;
          valSpan.textContent = dummyVal;
        }
      });
    }

    function generateNumbersForTarget(goal) {
      if (goal === 90) {
        const stepCount = (85 / 5);
        const randIndex = Math.floor(Math.random() * stepCount) + 1;
        centerNumber = randIndex * 5;
      } else {
        centerNumber = Math.floor(Math.random() * (goal - 1)) + 1;
      }
      centerVal.textContent = centerNumber;
    }

    // タップ回答処理
    function handleTap(chosenPosition) {
      if (isAnswering) return;
      isAnswering = true;

      const chosenVal = targetValues[chosenPosition];
      const isCorrect = (centerNumber + chosenVal === targetGoal);

      if (isCorrect) {
        correctCount++;
        feedbackElem.className = "absolute inset-0 flex items-center justify-center text-base font-bold text-emerald-500";
        feedbackElem.textContent = "◯ せいかい！";
      } else {
        feedbackElem.className = "absolute inset-0 flex items-center justify-center text-base font-bold text-rose-500";
        feedbackElem.textContent = `× ざんねん (${centerNumber} + ${chosenVal} = ${centerNumber + chosenVal})`;
      }

      setTimeout(() => {
        currentQuestion++;
        nextQuestion();
      }, 450);
    }

    // ゲーム終了処理＆ランキング更新
    function endGame() {
      clearInterval(timerInterval);
      const totalTimeNum = parseFloat(((Date.now() - startTime) / 1000).toFixed(2));

      gameScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');

      document.getElementById('final-mode').textContent = `目標：${targetGoal}`;
      document.getElementById('final-time').textContent = `${totalTimeNum.toFixed(2)} 秒`;
      document.getElementById('final-score').textContent = `${correctCount} / ${TOTAL_QUESTIONS} 問`;

      let isNewRecord = false;
      if (correctCount === TOTAL_QUESTIONS) {
        isNewRecord = saveScore(targetGoal, totalTimeNum);
      }

      const newRecordBadge = document.getElementById('new-record-badge');
      if (isNewRecord) {
        newRecordBadge.classList.remove('hidden');
      } else {
        newRecordBadge.classList.add('hidden');
      }

      updateRankingDisplay();
    }

    /* --- ランキング機能 (LocalStorage) --- */
    function getScores(goal) {
      const data = localStorage.getItem(`make_n_scores_${goal}`);
      return data ? JSON.parse(data) : [];
    }

    function saveScore(goal, time) {
      let scores = getScores(goal);
      const prevBest = scores.length > 0 ? scores[0] : null;

      scores.push(time);
      scores.sort((a, b) => a - b);
      scores = scores.slice(0, 3);

      localStorage.setItem(`make_n_scores_${goal}`, JSON.stringify(scores));

      return scores[0] === time && (!prevBest || time < prevBest);
    }

    function updateRankingDisplay() {
      document.getElementById('ranking-mode-title').textContent = targetGoal;
      document.getElementById('result-ranking-title').textContent = targetGoal;

      const scores = getScores(targetGoal);

      const renderList = (elemId) => {
        const listElem = document.getElementById(elemId);
        listElem.innerHTML = '';

        if (scores.length === 0) {
          listElem.innerHTML = '<li class="text-slate-400 font-normal italic">記録がまだありません</li>';
          return;
        }

        const medals = ['🥇', '🥈', '🥉'];
        scores.forEach((sc, idx) => {
          const li = document.createElement('li');
          li.className = 'flex justify-between items-center';
          li.innerHTML = `<span>${medals[idx]} ${idx + 1}位</span> <span class="font-mono text-slate-800">${sc.toFixed(2)} 秒</span>`;
          listElem.appendChild(li);
        });
      };

      renderList('start-ranking-list');
      renderList('result-ranking-list');
    }

    function resetCurrentRanking() {
      if (confirm(`「${targetGoal}」モードのベストタイム記録をリセットしますか？`)) {
        localStorage.removeItem(`make_n_scores_${targetGoal}`);
        updateRankingDisplay();
      }
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }
  </script>
</body>
</html>
